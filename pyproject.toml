[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-three-path-detective"
version = "1.0.0"
description = "麦麦三路比价侦探：同一份麦当劳点单在到店自取/麦乐送/得来速的真实到手价对比（基于麦当劳 MCP）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MCD Three-Path Detective author" }]
keywords = ["mcp", "mcdonalds", "price-comparison", "skill", "1024"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
mcd-three-path = "mcd_three_path.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
